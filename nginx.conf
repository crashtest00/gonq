server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /mobile {
        return 301 /mobile/;
    }

    location /mobile/ {
        try_files $uri /mobile/index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
