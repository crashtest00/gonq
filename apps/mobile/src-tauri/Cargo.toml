[package]
name = "gonq-mobile"
version = "0.1.5"
description = "Gonq mobile (Android) Tauri entry point"
edition = "2021"

[lib]
name = "gonq_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No ssh feature: SSH remote folders are not available on mobile (and russh must not be built for Android).
gonq-core = { path = "../../../crates/gonq-core", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

# Android only: the platform certificate verifier's JNI init (rustls-platform-verifier is already in the tree via reqwest;
# keep these in step with Cargo.lock) and the ndk-context pointers that Tauri's runtime (tao) sets.
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7.1"
jni = { version = "0.22.4", default-features = false }
ndk-context = "0.1"

[dev-dependencies]
keyring-core = "1"
