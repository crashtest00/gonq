<!DOCTYPE html>
<!--
  Gonq mobile screen set, v3 (Android). Corrected against the desktop app on origin/dev (version 0.1.5).
  Fonts: the app bundles Public Sans and JetBrains Mono through @fontsource; the Google Fonts link below only
  serves this standalone mockup. The logo is the real gonq-logo-OUTLINE.svg, embedded as a data URI, not recoloured.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gonq — Mobile Screen Set (v3)</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0B0C10;font-family:'Public Sans',sans-serif;color:#EDEEF0;padding:0 28px 80px;}
  .page-head{position:sticky;top:0;z-index:50;background:#0B0C10;padding:18px 0 14px;border-bottom:1px solid #1D2229;display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
  .page-head h1{font-size:16px;font-weight:700;}
  .page-head .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8F98;}
  .filter{display:flex;gap:6px;margin-left:auto;}
  .filter button{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:#14171F;color:#8A8F98;border:1px solid #2A2F38;border-radius:6px;padding:7px 12px;cursor:pointer;}
  .filter button.on{background:#177A59;color:#fff;border-color:#177A59;}
  body.only-light .dark-w{display:none;}
  body.only-dark .light-w{display:none;}

  .sec{margin-top:44px;}
  .sec-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  .sec-h .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:#8A8F98;}
  .sec-h h2{font-size:20px;font-weight:700;}
  .sec-h .src{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8A8F98;}
  .sec-h .pri{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:20px;border:1px solid #2A2F38;color:#8A8F98;}
  .sec-h .pri.high{color:#2FA079;border-color:#177A59;}
  .sec-note{font-size:13px;color:#8A8F98;max-width:860px;line-height:1.55;margin-bottom:14px;}
  .sec-note b{color:#C9CCD2;}
  .sec-note code{font-family:'JetBrains Mono',monospace;font-size:12px;color:#C9CCD2;}
  .frames{display:flex;flex-wrap:wrap;gap:34px 30px;}
  .cell .cap{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8F98;margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em;max-width:470px;}
  .pair{display:flex;gap:14px;}
  .pw{zoom:.6;}

  /* ---------- Phone ---------- */
  .phone{width:390px;height:844px;border-radius:44px;border:10px solid #000;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-size:15px;}
  .status{height:48px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:14px;font-weight:600;}
  .status .r{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .ic{flex-shrink:0;}

  .light{--bg:#F6F2E7;--surface:#FBF9F3;--ink:#14171F;--muted:#6B6659;--line:#DAD4C4;
         --primary:#146872;--primary-icon:#1E8A96;--link:#146872;--secondary:#2F7D6B;--rust:#A6432E;
         --npb:#A4DDED;--npb-ink:#1C6E86;--hl:#A4DDED;--kb:#D8D4C8;--key:#FBF9F3;--scrim:rgba(20,23,31,.38);
         --sel:rgba(20,104,114,.10);--selhi:rgba(30,138,150,.28);--warnbg:rgba(166,67,46,.08);--warnline:rgba(166,67,46,.38);
         --dfill:#A6432E;--on-dfill:#fff;--skel:#E8E2D2;--ba:#A9812F;--bb:#D4AF6A;--pressed:#E3DCCB;}
  .dark{--bg:#14171F;--surface:#1D2229;--ink:#EDEEF0;--muted:#8A8F98;--line:#2A2F38;
        --primary:#177A59;--primary-icon:#2FA079;--link:#2FA079;--secondary:#9C3B4F;--rust:#D66A52;
        --npb:#A4DDED;--npb-ink:#7FCBDE;--hl:rgba(164,221,237,.22);--kb:#262B33;--key:#3A404A;--scrim:rgba(0,0,0,.58);
        --sel:rgba(47,160,121,.14);--selhi:rgba(47,160,121,.38);--warnbg:rgba(214,106,82,.12);--warnline:rgba(214,106,82,.45);
        --dfill:#D66A52;--on-dfill:#14171F;--skel:#2A2F38;--ba:#C9A227;--bb:#E8C77A;--pressed:#343A44;}

  /* ---------- Bars ---------- */
  .topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--line);}
  .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;border-radius:8px;}
  .ib.on{background:var(--sel);color:var(--link);}
  .ib.dis{opacity:.4;}
  .topbar .ttl{flex:1;min-width:0;padding:0 4px;}
  .topbar .t1{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar .t2{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden;}
  .topbar .ttl.c{text-align:center;}
  .topbar .act{font-weight:600;font-size:15px;color:var(--link);padding:0 12px;height:44px;display:flex;align-items:center;flex-shrink:0;}
  .toolrow{height:48px;flex-shrink:0;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:0;height:46px;flex-shrink:0;overflow:hidden;}
  .seg div{width:46px;height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);}
  .seg .on{background:var(--primary);color:#fff;}
  .tabs{height:52px;flex-shrink:0;position:relative;border-bottom:1px solid var(--line);overflow:hidden;}
  .tabs-sc{display:flex;align-items:center;gap:4px;height:100%;padding:0 8px;overflow:hidden;}
  .tab-i{height:44px;border-radius:8px;padding:0 0 0 12px;display:flex;align-items:center;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;flex-shrink:0;max-width:220px;}
  .tab-i .tl{overflow:hidden;text-overflow:ellipsis;}
  .tab-i.on{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;}
  .tab-i .dirty{margin-left:6px;color:var(--link);font-size:12px;}
  .tab-x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
  .tab-add{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
  .cue{position:absolute;right:0;top:0;bottom:0;width:56px;background:linear-gradient(90deg,rgba(0,0,0,0),var(--bg) 62%);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:var(--muted);pointer-events:none;}
  .banner{flex-shrink:0;display:flex;gap:10px;align-items:center;padding:6px 8px 6px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:14px;line-height:1.45;}
  .banner .ic{color:var(--link);}
  .banner span.t{flex:1;}
  .lnk{color:var(--link);font-weight:600;white-space:nowrap;text-decoration:underline;min-height:44px;min-width:44px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .gerr{margin:10px 16px 0;border:1px solid var(--rust);color:var(--rust);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.45;flex-shrink:0;}
  .gnote{margin:10px 16px 0;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:0 0 0 12px;font-size:14px;line-height:1.45;display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .gnote span.t{flex:1;padding:10px 0;}
  .gnote .nx{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* ---------- Editor ---------- */
  .canvas{flex:1;overflow:hidden;padding:18px 22px 0;position:relative;min-height:0;}
  .canvas h1{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:14px;letter-spacing:-.01em;}
  .canvas .h2{font-size:18px;font-weight:600;margin:18px 0 8px;}
  .canvas p{font-size:16px;line-height:1.65;margin-bottom:12px;}
  .canvas ul{margin:0 0 12px 20px;font-size:16px;line-height:1.7;}
  .canvas blockquote{border-left:3px solid var(--primary-icon);padding-left:14px;color:var(--muted);font-size:16px;line-height:1.6;margin:6px 0 12px;}
  .canvas.raw{font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.75;white-space:pre-wrap;padding-top:16px;}
  .raw .mk{color:var(--link);}
  .raw .b{font-weight:600;}
  .hl{background:var(--hl);border-radius:3px;padding:1px 2px;}
  .selr{background:var(--selhi);border-radius:2px;}
  .marker{display:inline-flex;width:22px;height:22px;border-radius:11px;background:var(--npb);color:#14303a;font-size:12px;align-items:center;justify-content:center;vertical-align:middle;margin-left:2px;}
  .caret{display:inline-block;width:2px;height:18px;background:var(--primary-icon);vertical-align:text-bottom;margin-left:1px;}
  table.tbl{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0 12px;}
  table.tbl td,table.tbl th{border:1px solid var(--line);padding:9px 10px;text-align:left;}
  table.tbl th{background:var(--surface);font-weight:600;}
  table.tbl .cellsel{outline:2px solid var(--primary-icon);outline-offset:-2px;}

  .kbtool{height:56px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 6px;border-top:1px solid var(--line);background:var(--surface);}
  .kb-wrap{position:relative;flex:1;min-width:0;height:44px;overflow:hidden;}
  .kb-sc{display:flex;gap:2px;height:44px;align-items:center;}
  .kb-cue{position:absolute;right:0;top:0;bottom:0;width:48px;background:linear-gradient(90deg,rgba(0,0,0,0),var(--surface) 65%);display:flex;align-items:center;justify-content:flex-end;color:var(--muted);pointer-events:none;}
  .kb-bar{position:absolute;left:0;bottom:-6px;height:3px;border-radius:2px;background:var(--line);}
  .tb{width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .tb.dis{opacity:.35;}
  .tb.pressed{background:var(--pressed);}
  .vdiv{width:1px;height:24px;background:var(--line);flex-shrink:0;margin:0 3px;}
  .swap{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--link);flex-shrink:0;}
  .keyboard{height:262px;flex-shrink:0;background:var(--kb);padding:10px 4px 0;}
  .keyboard .kr{display:flex;justify-content:center;gap:5px;margin-bottom:11px;}
  .keyboard .k{width:32px;height:42px;border-radius:5px;background:var(--key);display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .keyboard .k.w{width:46px;}
  .keyboard .k.space{width:200px;}
  .home{height:26px;flex-shrink:0;display:flex;justify-content:center;align-items:flex-start;}
  .home i{width:130px;height:5px;border-radius:3px;background:var(--ink);opacity:.5;}

  /* ---------- Overlays ---------- */
  .scrim{position:absolute;inset:0;background:var(--scrim);z-index:5;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:16px 16px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:30px;}
  .handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 8px;flex-shrink:0;}
  .sh-t{padding:4px 20px 12px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .sh-b{padding:0 20px;}
  .dlg{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px 20px;box-shadow:0 12px 32px rgba(0,0,0,.3);}
  .dlg h3{font-size:18px;font-weight:700;margin-bottom:8px;line-height:1.35;word-break:break-word;}
  .dlg p{font-size:15px;line-height:1.5;color:var(--muted);margin-bottom:18px;}
  .dlg .row{display:flex;gap:10px;}
  .dlg .col{display:flex;flex-direction:column;gap:8px;}
  .drawer{position:absolute;left:0;top:48px;bottom:0;width:310px;z-index:6;background:var(--surface);border-right:1px solid var(--line);padding-top:0;display:flex;flex-direction:column;}
  .pop{position:absolute;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.3);min-width:220px;padding:6px;}
  .pop .pr{height:44px;padding:0 12px;display:flex;align-items:center;border-radius:6px;font-size:15px;}
  .pop .pr.dis{opacity:.4;}
  .pop hr{border:none;border-top:1px solid var(--line);margin:4px 0;}

  /* ---------- Form bits ---------- */
  .btn{height:44px;padding:0 18px;border-radius:6px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;white-space:nowrap;flex-shrink:0;}
  .btn.block{width:100%;}
  .btn.fl{flex:1;}
  .btn.sm{padding:0 14px;font-size:14px;}
  .btn.dis{opacity:.45;}
  .b-primary{background:var(--primary);color:#fff;}
  .b-out{border-color:var(--line);color:var(--ink);background:transparent;}
  .b-dest{background:var(--dfill);color:var(--on-dfill);}
  .b-destout{border-color:var(--warnline);color:var(--rust);background:transparent;}
  .b-text{color:var(--link);}
  .lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;}
  .field{min-height:44px;border:1px solid var(--line);border-radius:6px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);background:var(--bg);}
  .field.ph{color:var(--muted);}
  .field.focus{border-color:var(--primary-icon);box-shadow:0 0 0 3px var(--sel);}
  .field.bad{border-color:var(--rust);}
  .field.area{align-items:flex-start;padding:11px 12px;line-height:1.5;}
  .field.ro{background:transparent;}
  .field .ic{color:var(--muted);}
  .pfx{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:14px;}
  .hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:6px;}
  .hint.err{color:var(--rust);font-weight:500;}
  .err{color:var(--rust);font-size:14px;line-height:1.45;}
  .fg{margin-bottom:16px;}
  .badge{font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
  .pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;}
  .pill.open{background:var(--npb);color:#14303a;}
  .pill.res{background:var(--line);color:var(--muted);}
  mark{background:var(--hl);color:inherit;border-radius:2px;}
  .body{flex:1;overflow:hidden;min-height:0;position:relative;}
  .pad{padding:20px;}
  .lbl-up{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:16px 20px 8px;}
  .foot{flex-shrink:0;display:flex;gap:10px;padding:12px 20px 4px;border-top:1px solid var(--line);}
  .note{font-size:13px;color:var(--muted);line-height:1.45;}
  .stline{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted);}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--primary-icon);flex-shrink:0;}
  .dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin-bottom:16px;}
  .dl dt{color:var(--muted);}
  .dl dd{word-break:break-all;}
  .card{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);}

  /* ---------- Lists ---------- */
  .li{display:flex;align-items:center;gap:12px;padding:0 20px;min-height:56px;border-bottom:1px solid var(--line);}
  .li .ic{color:var(--muted);}
  .li .m{flex:1;min-width:0;}
  .li .t{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .li .t .o{color:var(--muted);font-weight:500;}
  .li .d{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .li .d.mono{font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  .li .r{font-size:12px;color:var(--muted);white-space:nowrap;}
  .li.sel{background:var(--sel);}
  .li.pad2{padding-top:8px;padding-bottom:8px;}
  .li.slim{min-height:48px;}
  .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .radio.on{border-color:var(--primary-icon);}
  .radio.on::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--primary-icon);}
  .tr{display:flex;align-items:center;gap:8px;min-height:44px;padding-right:16px;font-size:15px;}
  .tr .ic{color:var(--muted);}
  .tr.sel{background:var(--sel);color:var(--link);font-weight:600;}
  .tr.sel .ic{color:var(--link);}
  .tr .ch{width:16px;display:flex;justify-content:center;}
  .tr.msg{font-size:14px;color:var(--muted);}
  .tr.msg.e{color:var(--rust);}
  .ctl{padding:12px 16px 10px;border-bottom:1px solid var(--line);}
  .ctl .row{display:flex;gap:8px;margin-top:8px;}
  .bsel{height:44px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 12px;font-family:'JetBrains Mono',monospace;font-size:14px;}
  .bsel .ic{color:var(--muted);}
  .bsel .ch{margin-left:auto;}
  .sech{font-size:14px;font-weight:700;padding:14px 20px 8px;}

  /* ---------- Menu ---------- */
  .mgrp{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 20px 4px;}
  .mrow{display:flex;align-items:center;gap:10px;height:44px;padding:0 20px;font-size:15.5px;}
  .mrow.dis{opacity:.4;}
  .mrow .mk{width:20px;display:flex;justify-content:center;color:var(--link);flex-shrink:0;}
  .mrow .sub{margin-left:auto;color:var(--muted);display:flex;}
  .msep{border-top:1px solid var(--line);margin:4px 20px;}
  .cbx{width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;}

  /* ---------- Recents / tabbar ---------- */
  .dhead{padding:10px 20px 4px;}
  .dhead .big{font-size:28px;font-weight:700;letter-spacing:-.01em;}
  .entry{display:flex;gap:10px;padding:12px 16px 4px;}
  .entry .btn{flex:1;padding:0 10px;font-size:14px;}
  .entry .btn .ic{color:var(--link);}
  .rlist{flex:1;overflow:hidden;position:relative;min-height:0;}
  .rx{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;margin-right:-10px;}
  .fab{position:absolute;right:20px;bottom:18px;width:56px;height:56px;border-radius:16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.25);}
  .tabwrap{flex-shrink:0;border-top:1px solid var(--line);background:var(--surface);}
  .tabwrap .home{height:22px;}
  .tabbar{height:58px;display:flex;padding-top:6px;}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted);}
  .tabbar .tab.on{color:var(--link);}

  /* ---------- Specific ---------- */
  .codebox{display:flex;gap:10px;align-items:center;margin-bottom:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 8px 8px 14px;}
  .code{flex:1;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;letter-spacing:.08em;}
  .addr{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted);}
  .addr span{flex:1;min-width:0;word-break:break-all;}
  .steps{display:flex;padding:12px 16px 10px;gap:6px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .steps .s{flex:1 1 auto;min-width:0;}
  .steps .bar{height:3px;border-radius:2px;background:var(--line);margin-bottom:7px;}
  .steps .s.on .bar,.steps .s.done .bar{background:var(--primary-icon);}
  .steps .nm{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .steps .s.on .nm,.steps .s.done .nm{color:var(--ink);}
  .sk{height:12px;border-radius:6px;background:var(--skel);}
  .skrow{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);}
  .skrow .sk.ico{width:20px;height:20px;border-radius:5px;}
  .empty{text-align:center;padding:64px 28px 0;}
  .empty .ico{width:56px;height:56px;border-radius:14px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--sel);color:var(--link);}
  .empty p{font-size:15px;line-height:1.5;color:var(--muted);margin-bottom:20px;}
  .diff{font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;}
  .diff .a{color:var(--link);} .diff .d{color:var(--rust);}
  .splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
  .anchor{border-left:2px solid var(--npb);padding-left:10px;font-size:13.5px;font-style:italic;color:var(--muted);line-height:1.45;}
  .th{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;}
  .msgh{font-size:12.5px;font-weight:600;color:var(--muted);}
  .msgb{font-size:15px;line-height:1.5;}
  .preview{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:12px 14px;font-size:13.5px;line-height:1.5;overflow:hidden;}
  .preview h4{font-size:16px;margin-bottom:8px;}
  .preview h5{font-size:14px;margin:10px 0 6px;}
  .preview pre{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;color:var(--muted);margin:6px 0;white-space:pre-wrap;}
</style>

/* 2 Repo picker */
const repoRow=(o,n,priv,ro,q)=>`<div class="li slim"><div class="m"><div class="t" style="font-weight:500"><span class="o">${o}/</span>${hlite(n,q)}</div></div>${priv?'<span class="badge">private</span>':''}${ro?'<span class="badge">read-only for you</span>':''}</div>`;

const fFocus=(v)=>field(v,'focus','search');

S.branchesCap=()=>over(navScreen(),sheet('Branches',`<div class="sh-b" style="padding-bottom:8px">${field('Filter branches','ph','search')}</div><div style="border-top:1px solid var(--line)">${['dependabot/npm/vite-5.4.2','feature/q3-rollout','gonq/q3-rollout','main'].map(b=>brRow(b,b==='gonq/q3-rollout')).join('')}</div><p class="note" style="padding:12px 20px 0">Showing the first 100 of 412 branches. Type to narrow the list.</p>`));
S.branchesNoMatch=()=>over(navScreen(),sheet('Branches',`<div class="sh-b" style="padding-bottom:8px">${field('zzz','focus','search')}</div><p class="note" style="padding:12px 20px 0;border-top:1px solid var(--line)">No branch matches.</p>`));
S.branchesErr=()=>over(navScreen(),sheet('Branches',`<div class="sh-b" style="padding-bottom:8px">${field('Filter branches','ph','search')}</div><div style="border-top:1px solid var(--line);padding:12px 20px 0;display:flex;flex-direction:column;gap:10px;align-items:flex-start"><p class="err" role="alert">GitHub rate limit reached. Try again after 14:05.</p>${retryBtn()}</div>`));
const cbSheet=({name='',reason='',exists=false,commit=false,error='',left=false,source='gonq/q3-rollout'}={})=>sheet('Create branch',`<div class="sh-b"><p class="note" style="font-size:14.5px;margin-bottom:12px;word-break:break-all">From ${source}</p>
  <div class="field ${reason||exists?'bad':'focus'}" aria-label="Branch name"><span class="pfx" data-testid="branch-prefix">gonq/</span><span class="mono" style="font-size:14px;flex:1;margin-left:-6px">${name}<span class="caret"></span></span></div>
  <p class="hint err" role="status" style="min-height:20px;margin-bottom:10px">${reason||(exists?'That branch already exists':'')}</p>
  ${commit?`<p style="font-size:14.5px;line-height:1.45;margin-bottom:12px;overflow-wrap:anywhere">Creating this branch will also commit your changes in ${PATH} to it.</p>`:''}
  ${error?`<p class="err" role="alert" style="margin-bottom:12px">${error}</p>`:''}
  <div style="display:flex;gap:10px">${btn('b-out fl',left?'Close':'Cancel')}${btn(`b-primary fl ${reason||exists||left||!name?'dis':''}`,'Create')}</div></div>`);

/* 4 Commit (CommitDialog) */
const commitSheet=(branch)=>{const warn=!branch.startsWith('gonq/');return sheet(`Commit ${PATH}?`,`<div class="sh-b"><dl class="dl"><dt>File</dt><dd>${PATH}</dd><dt>Repository</dt><dd>${REPO}</dd><dt>Branch</dt><dd>${branch}</dd><dt>Message</dt><dd>Edit ${PATH} from Gonq</dd></dl>
  ${warn?`<p role="note" class="err" style="margin-bottom:16px">This commits directly to ${branch}. Branch protection and review rules are GitHub’s; Gonq does not check them.</p>`:''}
  <div style="display:flex;flex-direction:column;gap:8px">${btn('b-primary block','Commit')}${warn?btn('b-out block','Commit to new branch…','branchPlus'):''}${btn('b-text block','Cancel')}</div></div>`).replace('class="sh-t"','class="sh-t" style="font-size:17px;word-break:break-all"');};
S.commitWarn=()=>over(editor({kb:false,sub:'main',body:editorDoc(false)}),commitSheet('main'));
S.commitFeature=()=>over(editor({kb:false,sub:'feature/q3-rollout',body:editorDoc(false)}),commitSheet('feature/q3-rollout'));

S.commitErr=()=>editor({kb:false,sub:'main',body:editorDoc(false),banner:errBanner('GitHub returned 409: Repository rule violations found')});
S.commitRefused=()=>editor({kb:false,sub:'gonq/fix-typos',body:editorDoc(false),banner:`<div class="banner" role="status"><span class="t">Pull request #41 is open for this branch. You can read this document but not change it.</span><span class="lnk">Open PR</span></div>`+errBanner('Pull request #41 is open for this branch. You can read this document but not change it.')});

/* 5 Open PR (OpenPrDialog): Repository + Branch to merge + Merge into + Review changes on one screen, then details, then result */
const prSteps=(n)=>`<div class="steps">${['Branch to merge','Merge into','Review changes'].map((s,i)=>`<div class="s ${i+1===n?'on':i+1<n?'done':''}"><div class="bar"></div><div class="nm">${s}</div></div>`).join('')}</div>`;
const prShell=(step,inner,canOpen,showOpen=true,offset=0)=>`${status}${nav('','Open pull request','')}${prSteps(step)}<div class="body"><div style="margin-top:-${offset}px">${inner}</div></div><div class="foot">${btn('b-out fl','Cancel')}${showOpen?btn(`b-primary fl ${canOpen?'':'dis'}`,'Open PR'):''}</div><div style="height:30px;flex-shrink:0"></div>`;
const repoSel=`<div style="padding:14px 20px 4px"><span class="lbl">Repository</span><div class="bsel" aria-label="Repository"><span>${REPO}</span><span class="ch">${I('chevD',18)}</span></div></div>`;
const srcRow=(b,on,pull)=>`<div class="li slim" style="${on?'background:var(--sel)':''}"><div class="radio ${on?'on':''}"></div><span class="mono" style="font-size:14px;flex:1;word-break:break-all">${b}</span>${pull?`<span class="lnk" style="margin-right:-10px">#${pull}</span>`:''}</div>`;
const srcList=(sel)=>`<div class="sech">Branch to merge</div><div style="border-top:1px solid var(--line)">${srcRow('gonq/q3-rollout',sel==='gonq/q3-rollout')}${srcRow('gonq/fix-typos',sel==='gonq/fix-typos',41)}${srcRow('feature/q3-rollout',sel==='feature/q3-rollout')}</div>`;
const tgtList=(sel,src='gonq/q3-rollout')=>`<div class="sech" style="padding-top:18px">Merge into</div><div style="padding:0 20px 8px">${field('Filter branches','ph','search')}</div><div style="border-top:1px solid var(--line)">${['main','feature/q3-rollout','gonq/fix-typos','release/q3'].filter(b=>b!==src).map(b=>srcRow(b,b===sel)).join('')}</div>`;
const fileRow=(n,st,a,d)=>`<div style="padding:9px 12px;border-bottom:1px solid var(--line)"><div style="font-size:14px;word-break:break-all">${n}</div><div class="note">${st} · +${a} −${d}</div></div>`;
const review=`<div class="sech" style="padding-top:18px">Review changes</div><div style="padding:0 20px"><p style="font-size:14.5px;margin-bottom:4px">3 commits ahead, 0 commits behind main</p><p style="font-size:14.5px;margin-bottom:10px">2 files changed, +14 −3</p><div style="border:1px solid var(--line);border-radius:6px" aria-label="Changed files">${fileRow(PATH,'modified',12,3)}${fileRow('README.md','modified',2,0).replace('border-bottom:1px solid var(--line)','')}</div></div>`;
S.pr1=()=>prShell(1,repoSel+srcList(''),false);
S.pr1Empty=()=>prShell(1,repoSel+`<div class="sech">Branch to merge</div><p class="note" style="padding:0 20px;font-size:14.5px">No branches to merge from this session.</p>`,false);
S.pr1Load=()=>prShell(1,repoSel+`<div class="sech">Branch to merge</div><p class="stline" role="status" style="padding:0 20px">${spin}Checking branches…</p>`,false);

S.pr3Comparing=()=>prShell(3,repoSel+srcList('gonq/q3-rollout')+tgtList('main')+`<div class="sech" style="padding-top:18px">Review changes</div><p class="stline" role="status" style="padding:0 20px">${spin}Comparing…</p>`,false,true,276);
S.pr3Trunc=()=>prShell(3,repoSel+srcList('gonq/q3-rollout')+tgtList('main')+review.replace('<div style="border:1px','<p role="note" class="err" style="margin-bottom:10px">GitHub cut the file list off, so some changed files are not listed and the totals cover only those shown.</p><div style="border:1px'),true,true,276);
S.prOpenAlready=()=>prShell(3,repoSel+srcList('gonq/fix-typos')+`<div class="sech" style="padding-top:18px">Merge into</div><div style="padding:0 20px">${field('Filter branches','ph','search')}</div><div class="sech" style="padding-top:18px">Review changes</div><p role="status" style="padding:0 20px;font-size:14.5px;line-height:1.5">Pull request #41 is already open for this branch: <span class="lnk" style="padding:0 2px;vertical-align:middle">#41</span></p>`,false,false,0);

2 files changed, +14 −3

Opened from Gonq`;

S.stPickNone=()=>pickerShell(field('Filter by owner/repo','ph','search'),`<p class="note" role="status" style="padding:18px 20px;font-size:14.5px">No repositories found for this account.</p>`);

S.stNavMore=()=>navScreen('main',tr(0,'dir','notes',{open:1})+tr(1,'file','2026-07-01.md')+tr(1,'file','2026-07-02.md')+tr(1,'file','2026-07-03.md')+`<div class="tr msg" style="padding-left:60px">Show more (148 more)</div>`+`<div class="tr msg" style="padding-left:60px">Showing what GitHub returned; the folder may have more.</div>`+tr(0,'file','README.md'));

/* 18 Comments (CommentsSidebar) */
S.cmList=()=>commentsSheet(listBody());
S.cmEmpty=()=>commentsSheet(listBody(true));

S.cmResolved=()=>commentsSheet(thHead('resolved','1d ago')+`<div style="padding:4px 20px 0;display:flex;flex-direction:column;gap:12px"><div><div class="msgh">J. Tran · 1d ago</div><div class="msgb">Should the legal note move above the open items list?</div></div><div><div class="msgh">R. Okafor · 1d ago</div><div class="msgb">Moved. Resolving.</div></div></div>`+replyBox('resolved'));
S.cmEdit=()=>commentsSheet(thHead('open').replace('<div class="ib "','<div class="ib dis"')+`<div style="padding:4px 20px 0"><div class="anchor" style="margin-bottom:12px">rollout now targets the 14th</div><div class="field area focus" style="min-height:96px" aria-label="Edit comment">Can we confirm the 14th with logistics and support before publishing?<span class="caret"></span></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">${btn('b-out','Cancel')}${btn('b-primary','Save')}</div></div>`);
S.cmDelete=()=>over(editor({kb:false,body:editorDoc(true),on:'comments'}),`<div class="dlg"><h3>Delete thread “rollout now targets the 14th”?</h3><p>The whole thread, including its replies, is removed from the document.</p><div class="row">${btn('b-out fl','Cancel')}${btn('b-dest fl','Delete')}</div></div>`);
S.cmNew=()=>over(editor({kb:false,body:ctxDoc,on:'comments'}),sheet('',`<div style="padding:6px 20px 0;display:flex;flex-direction:column;gap:14px"><span style="font-size:16px;font-weight:700">New comment</span><div class="anchor">On: 'rollout now targets the 14th'</div><div class="field area focus ph" style="min-height:96px" aria-label="Comment">Write a comment…</div><div style="display:flex;justify-content:flex-end;gap:10px">${btn('b-out','Cancel')}${btn('b-primary','Submit')}</div></div>`));

const root=document.getElementById('root');
let count=0;
SECTIONS.forEach(s=>{
  const frames=s.f.map(([cap,k])=>{count++;return `<div class="cell"><div class="cap">${cap}</div><div class="pair">${['light','dark'].map(m=>`<div class="pw ${m}-w"><div class="phone ${m}" data-frame="${k}">${S[k]()}</div></div>`).join('')}</div></div>`;}).join('');
  root.insertAdjacentHTML('beforeend',`<section class="sec"><div class="sec-h"><span class="n">${s.n==='—'?'':'#'+s.n}</span><h2>${s.t}</h2><span class="src">${s.src}</span>${s.pri?`<span class="pri ${s.pri}">${s.pri}</span>`:''}</div>${s.note?`<div class="sec-note">${s.note}</div>`:''}<div class="frames">${frames}</div></section>`);
});
document.querySelector('.page-head .sub').textContent=`${count} frames · light + dark · 390×844 portrait · Android`;
document.getElementById('filter').addEventListener('click',e=>{
  const m=e.target.dataset.m; if(!m) return;
  document.body.classList.remove('only-light','only-dark'); if(m!=='both') document.body.classList.add('only-'+m);
  document.querySelectorAll('#filter button').forEach(b=>b.classList.toggle('on',b===e.target));
});
</script>
