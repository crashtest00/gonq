name: release-desktop

# Production desktop release. Jenkins is the only thing that pushes the v* tag
# (production-promote, "Tag and publish desktop release"). Never push it by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            artifact_glob: src-tauri/target/release/bundle/nsis/*.exe
          - label: macos
            os: macos-latest
            artifact_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - label: linux
            os: ubuntu-22.04
            artifact_glob: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Linux system packages
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build unsigned package
        run: npm run tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonq-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    # Only runs when every platform leg succeeded: no partial releases.
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l release-assets
          gh release create "$TAG" release-assets/* \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
