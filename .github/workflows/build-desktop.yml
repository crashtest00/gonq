name: build-desktop

# Native validation build. Dispatched only by Jenkins (release-candidate job,
# "Trigger native validation build"). Never add pull_request/push/tag triggers.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            artifact_glob: src-tauri/target/release/bundle/nsis/*.exe
          - label: macos
            os: macos-latest
            artifact_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - label: linux
            os: ubuntu-22.04
            artifact_glob: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verify checkout matches requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$REQUESTED_SHA" ]; then
            echo "::error::Checked out $actual but $REQUESTED_SHA was requested"
            exit 1
          fi

      - name: Install Linux system packages
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build unsigned package
        run: npm run tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonq-${{ matrix.label }}-${{ inputs.sha }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
