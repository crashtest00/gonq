name: build-mobile

# Debug-signed aarch64 Android APK of apps/mobile (story M-09).
# Dispatched by a human, or by the orchestrator on the owner's say-so. Jenkins never dispatches it.
# Never add pull_request/push/tag triggers.
# Signing is the standard debug signing Gradle applies on its own: no keystore, no Actions secrets, no fingerprint pin.
# Android builds only ever run here, never on the Jenkins box.
# The build steps live in .github/actions/android-apk, shared with release-mobile.yml.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (android aarch64 debug)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verify checkout matches requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$REQUESTED_SHA" ]; then
            echo "::error::Checked out $actual but $REQUESTED_SHA was requested"
            exit 1
          fi

      - name: Build, sign and verify the APK (shared android-apk action)
        id: apk
        uses: ./.github/actions/android-apk
        with:
          apk-name: gonq-android-debug-signed-${{ inputs.sha }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonq-android-debug-signed-${{ inputs.sha }}.apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Job summary
        run: |
          {
            echo "## Gonq Android debug-signed APK"
            echo
            echo "SHA \`${{ inputs.sha }}\`, aarch64, debug build, \`apksigner verify\` passed."
            echo
            echo "**Each CI build gets a new debug key.** A tester must uninstall an earlier build before installing a newer one (accepted for this beta; Android refuses an update signed by a different key, and an uninstall removes the stored GitHub token). \`versionCode\` is constant until M-33."
            echo
            echo '```'
            cat apksigner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
