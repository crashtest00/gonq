name: build-mobile

# Debug-signed aarch64 Android APK of apps/mobile (story M-09).
# Dispatched by a human, or by the orchestrator on the owner's say-so. Jenkins never dispatches it.
# Never add pull_request/push/tag triggers.
# Signing is the standard debug signing Gradle applies on its own: no keystore, no Actions secrets, no fingerprint pin.
# Android builds only ever run here, never on the Jenkins box.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to build
        required: true
        type: string

permissions:
  contents: read

env:
  ANDROID_TARGET: aarch64-linux-android
  # Pinned: compileSdk 37 is what the generated Gradle project (Tauri 2.12 template) asks for; the NDK matches rust-checks.yml.
  ANDROID_PLATFORM: android-37
  ANDROID_BUILD_TOOLS: 37.0.0
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  build:
    name: build (android aarch64 debug)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verify checkout matches requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$REQUESTED_SHA" ]; then
            echo "::error::Checked out $actual but $REQUESTED_SHA was requested"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_TARGET }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-build

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/gen/android/**/*.gradle*', 'apps/mobile/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'Cargo.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Android SDK platform, build-tools and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK (aarch64)
        working-directory: apps/mobile
        run: npm run tauri android build -- --debug --apk --target aarch64 --ci

      - name: Locate APK
        id: apk
        run: |
          apks="$(find apps/mobile/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print)"
          echo "$apks"
          if [ "$(printf '%s\n' "$apks" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one APK"
            exit 1
          fi
          cp "$apks" "gonq-android-debug-signed-${{ inputs.sha }}.apk"
          echo "path=gonq-android-debug-signed-${{ inputs.sha }}.apk" >> "$GITHUB_OUTPUT"

      # Fails the job if the APK is unsigned or its signature does not verify.
      - name: Verify APK signature (apksigner)
        run: |
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs "${{ steps.apk.outputs.path }}" | tee apksigner.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonq-android-debug-signed-${{ inputs.sha }}.apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Job summary
        run: |
          {
            echo "## Gonq Android debug-signed APK"
            echo
            echo "SHA \`${{ inputs.sha }}\`, aarch64, debug build, \`apksigner verify\` passed."
            echo
            echo "**Each CI build gets a new debug key.** A tester must uninstall an earlier build before installing a newer one (accepted for this beta; Android refuses an update signed by a different key, and an uninstall removes the stored GitHub token). \`versionCode\` is constant until M-33."
            echo
            echo '```'
            cat apksigner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
