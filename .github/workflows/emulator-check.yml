name: emulator-check

# Orchestrator verification tooling (Gonq mobile build, M-13 / M-34), not product CI.
# Runs only on pushes to the aigang/emulator-check branch, which never merges into dev.
# Installs a debug-signed APK artifact from a build-mobile run on an Android emulator and
# drives the app's debuggable WebView with Playwright's Android API (.emulator/check.cjs).
# The GitHub device code is posted as a commit comment so the owner can approve it once.
on:
  push:
    branches: [aigang/emulator-check]

permissions:
  contents: write
  actions: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read parameters
        run: cat .emulator/params.env >> "$GITHUB_ENV"
      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          gh run download "$APK_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$APK_ARTIFACT" -D apk
          find apk -name '*.apk' -exec ls -l {} \;
          echo "APK_PATH=$(find "$PWD/apk" -name '*.apk' | head -1)" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (Android API only, no browsers)
        run: npm i --no-save --prefix .emulator playwright-core@1.56.1
      - name: Run checks on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node .emulator/check.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence-${{ github.sha }}
          path: evidence/
