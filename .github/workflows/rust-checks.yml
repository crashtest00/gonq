name: rust-checks
run-name: rust-checks ${{ inputs.request_id }}

# Rust tests + clippy for the PR build, on ubuntu, windows and macos (the three
# desktop targets, so a platform-specific Rust failure is caught before merge,
# not in build-desktop on dev). Dispatched only by Jenkins (Jenkinsfile,
# stage "Rust checks", PR builds against dev), which awaits the run and fails
# the PR build when it fails. It also fails when the committed generated
# bindings (apps/desktop/src/platform/bindings.ts) drift from the Rust. `request_id` is the correlation id Jenkins finds
# the run by (it is in the run name). Never add pull_request/push/tag triggers.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to check
        required: true
        type: string
      request_id:
        description: Correlation id chosen by Jenkins to find this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust:
    name: cargo test + clippy (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            os: ubuntu-22.04
          - label: windows
            os: windows-latest
          - label: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verify checkout matches requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$REQUESTED_SHA" ]; then
            echo "::error::Checked out $actual but $REQUESTED_SHA was requested"
            exit 1
          fi

      - name: Install Linux system packages
        if: matrix.label == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # tauri::generate_context! needs frontendDist (apps/desktop/dist) to exist.
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test (Rust)
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The export test rewrites bindings.ts from the Rust command list; any
      # difference from the committed file means it was not regenerated. Ubuntu
      # only: on Windows actions/checkout applies autocrlf (CRLF working tree)
      # while the generated file is LF, so a diff there would be line-ending
      # noise. The file is the same on every OS, one leg is enough.
      - name: Bindings drift check
        if: matrix.label == 'ubuntu'
        run: |
          cargo test --locked -p gonq export_bindings
          if ! git diff --exit-code -- apps/desktop/src/platform/bindings.ts; then
            echo "::error file=apps/desktop/src/platform/bindings.ts::bindings.ts is out of date with the Rust commands; run 'cargo test -p gonq export_bindings' and commit the result"
            exit 1
          fi
