name: rust-checks
run-name: rust-checks ${{ inputs.request_id }}

# Rust tests + clippy for the PR build, on ubuntu, windows and macos (the three
# desktop targets, so a platform-specific Rust failure is caught before merge,
# not in build-desktop on dev). Dispatched only by Jenkins (Jenkinsfile,
# stage "Rust checks", PR builds against dev), which awaits the run and fails
# the PR build when it fails. It also fails when the committed generated
# bindings (packages/editor/src/platform/bindings.ts) drift from the Rust. On the
# ubuntu leg it also tests gonq-core without its default features (no `ssh`
# feature, the mobile build) and fails if russh, russh-sftp or ssh2-config are in
# that build's dependency tree. A separate `android` job (ubuntu) runs
# `cargo check -p gonq-mobile --target aarch64-linux-android` and the same
# no-SSH tree check against that target; it skips (logged) until crate
# gonq-mobile exists (story M-06). `request_id` is the correlation id Jenkins finds
# the run by (it is in the run name). Never add pull_request/push/tag triggers.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to check
        required: true
        type: string
      request_id:
        description: Correlation id chosen by Jenkins to find this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust:
    name: cargo test + clippy (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu
            os: ubuntu-22.04
          - label: windows
            os: windows-latest
          - label: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verify checkout matches requested SHA
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$REQUESTED_SHA" ]; then
            echo "::error::Checked out $actual but $REQUESTED_SHA was requested"
            exit 1
          fi

      - name: Install Linux system packages
        if: matrix.label == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # tauri::generate_context! needs frontendDist (apps/desktop/dist) to exist.
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test (Rust)
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # The export test rewrites bindings.ts from the Rust command list; any
      # difference from the committed file means it was not regenerated. Ubuntu
      # only: on Windows actions/checkout applies autocrlf (CRLF working tree)
      # while the generated file is LF, so a diff there would be line-ending
      # noise. The file is the same on every OS, one leg is enough.
      - name: Bindings drift check
        if: matrix.label == 'ubuntu'
        run: |
          cargo test --locked -p gonq export_bindings
          if ! git diff --exit-code -- packages/editor/src/platform/bindings.ts; then
            echo "::error file=packages/editor/src/platform/bindings.ts::bindings.ts is out of date with the Rust commands; run 'cargo test -p gonq export_bindings' and commit the result"
            exit 1
          fi

      # The no-SSH build (the mobile app compiles gonq-core without feature
      # `ssh`): its tests must pass and its normal dependency tree must hold no
      # SSH crate. --prefix none prints one "name vX.Y.Z" per line, so the
      # anchored match below is on exact crate names only.
      # The Android build of the same check is the `android` job below.
      - name: No-SSH build (tests + no SSH crates)
        if: matrix.label == 'ubuntu'
        env:
          TREE_ARGS: -p gonq-core --no-default-features
        run: |
          cargo test --locked -p gonq-core --no-default-features
          cargo tree --locked $TREE_ARGS -e normal --prefix none > no-ssh-tree.txt
          if grep -E '^(russh|russh-sftp|ssh2-config) v' no-ssh-tree.txt | sort -u > ssh-found.txt && [ -s ssh-found.txt ]; then
            echo "::error::SSH crates found in the no-SSH build ($TREE_ARGS):"
            cat ssh-found.txt
            exit 1
          fi
          echo "No SSH crates in: cargo tree $TREE_ARGS -e normal"

  android:
    name: cargo check (android)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID_TARGET: aarch64-linux-android
    steps:
      - name: Check out requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verify checkout matches requested SHA
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$REQUESTED_SHA" ]; then
            echo "::error::Checked out $actual but $REQUESTED_SHA was requested"
            exit 1
          fi

      # Until crate gonq-mobile exists (story M-06) there is nothing to check;
      # every later step is gated on this output.
      - name: Detect gonq-mobile crate
        id: crate
        run: |
          if grep -q '^name *= *"gonq-mobile"' apps/mobile/src-tauri/Cargo.toml 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crate gonq-mobile not found; skipping the Android check"
          fi

      # Same system packages as the desktop legs: the workspace's desktop crate
      # is resolved too, and tauri build scripts probe for the webkit libraries.
      - name: Install Linux system packages
        if: steps.crate.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        if: steps.crate.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.crate.outputs.present == 'true'
        with:
          targets: ${{ env.ANDROID_TARGET }}

      - uses: swatinem/rust-cache@v2
        if: steps.crate.outputs.present == 'true'
        with:
          workspaces: ". -> target"
          key: android

      # The ubuntu-22.04 image ships an NDK ($ANDROID_NDK_LATEST_HOME); install
      # the SDK's own copy if a runner image ever lacks it. The cc/ar of the
      # NDK's clang toolchain are what ring's build script needs.
      - name: Set up Android NDK
        if: steps.crate.outputs.present == 'true'
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            ndk="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      # tauri::generate_context! needs frontendDist to exist.
      - name: Install dependencies
        if: steps.crate.outputs.present == 'true'
        run: npm ci

      - name: Build frontend
        if: steps.crate.outputs.present == 'true'
        run: npm run build

      - name: Cargo check (Android)
        if: steps.crate.outputs.present == 'true'
        run: cargo check --locked -p gonq-mobile --target "$ANDROID_TARGET"

      - name: No SSH crates in the Android build
        if: steps.crate.outputs.present == 'true'
        run: |
          cargo tree --locked -p gonq-mobile --target "$ANDROID_TARGET" -e normal --prefix none > no-ssh-tree.txt
          if grep -E '^(russh|russh-sftp|ssh2-config) v' no-ssh-tree.txt | sort -u > ssh-found.txt && [ -s ssh-found.txt ]; then
            echo "::error::SSH crates found in the Android build:"
            cat ssh-found.txt
            exit 1
          fi
          echo "No SSH crates in: cargo tree -p gonq-mobile --target $ANDROID_TARGET -e normal"
