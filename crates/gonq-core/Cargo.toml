[package]
name = "gonq-core"
version = "0.1.5"
description = "Gonq shared core: GitHub, SSH, settings, recents and folder commands"
edition = "2021"
links = "tauri-plugin-gonq"

[lib]
name = "gonq_core"

[build-dependencies]
embed-resource = "3"
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
ssh2-config = "0.8.1"
zeroize = { version = "1.9.1", features = ["serde"] }
dirs = "7.0.0"
hmac = "0.13.0"
sha1 = "0.11.0"
base64 = "0.23.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
url = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = "4.2.0"
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[dev-dependencies]
tempfile = "3"
rand = "0.10"
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
